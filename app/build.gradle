plugins {
    id 'com.android.application'
}

android {
    namespace 'com.unitytest.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.unitytest.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // LevelPlay Mediation SDK
    implementation('com.unity3d.ads-mediation:mediation-sdk:9.5.0') {
        exclude group: 'com.unity3d.ads-mediation', module: 'adquality-sdk'
    }

    // نحدد نسخة AdQuality/OMID يدويًا لأن النسخة التلقائية (9.9.0) غير منشورة فعليًا بأي مستودع
    implementation 'com.unity3d.ads-mediation:adquality-sdk:9.8.0'

    // مطلوبة لجلب GAID و App Set ID
    implementation 'com.google.android.gms:play-services-appset:16.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.1.0'
}

// حل تعارض Duplicate class بين kotlin-stdlib الحديثة والنسخ القديمة jdk7/jdk8
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
